# docker-compose.dev.yml - Development/Debug environment
# Usage:
#   1. Start containers: docker-compose -f docker-compose.dev.yml up -d
#   2. VS Code: "Dev Containers: Attach to Running Container..." → msf-dev
#   3. Open /usr/src/metasploit-framework and start debugging with F5
services:
  msf-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        user_id: ${UID:-1000}
        group_id: ${GID:-1000}
    environment:
      DATABASE_URL: postgres://postgres@db:5432/msf?pool=200&timeout=5
      RAILS_ENV: development
    depends_on:
      - db
    ports:
      # Reverse shell listener
      - "4444:4444"
    volumes:
      # Mount source code for hot reload
      - .:/usr/src/metasploit-framework
      # msf4 config directory
      - ${HOME}/.msf4:/home/developer/.msf4
      # Bundle cache
      - bundle_cache:/usr/local/bundle
      # Zsh history persistence
      - zsh_history:/zsh-volume
    stdin_open: true
    tty: true
    # Keep container running, start msfconsole manually via docker exec
    command: sleep infinity

  db:
    image: postgres:10-alpine
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  pg_data_dev:
    driver: local
  bundle_cache:
    driver: local
  zsh_history:
    driver: local
