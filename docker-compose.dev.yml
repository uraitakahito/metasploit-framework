# docker-compose.dev.yml - Development/Debug environment
# Usage:
#   1. Start containers: docker-compose -f docker-compose.dev.yml up -d
#   2. VS Code: "Dev Containers: Attach to Running Container..." → msf-dev
#   3. Open /usr/src/metasploit-framework and start debugging with F5
services:
  msf-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        user_id: ${UID:-1000}
        group_id: ${GID:-1000}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: msf
      DB_USER: postgres
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Reverse shell listener
      - "4444:4444"
    volumes:
      # Mount source code for hot reload
      - .:/usr/src/metasploit-framework
      # msf4 config directory
      - ${HOME}/.msf4:/home/developer/.msf4
      # Zsh history persistence
      - zsh_history:/zsh-volume
    stdin_open: true
    tty: true
    # Keep container running, start msfconsole manually via docker exec
    command: sleep infinity

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pg_data_dev:
  zsh_history:
