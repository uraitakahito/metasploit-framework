# docker-compose.dev.yml - Development/Debug environment
services:
  msf-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        user_id: ${UID:-1000}
        group_id: ${GID:-1000}
    environment:
      DATABASE_URL: postgres://postgres@db:5432/msf?pool=200&timeout=5
      RAILS_ENV: development
      DEV_MODE: "true"
    depends_on:
      - db
    ports:
      # Reverse shell listener
      - "4444:4444"
      # Debug port for rdbg DAP
      - "38697:38697"
    volumes:
      # Mount source code for hot reload
      - .:/usr/src/metasploit-framework
      # msf4 config directory
      - ${HOME}/.msf4:/home/msf/.msf4
      # Bundle cache
      - bundle_cache:/usr/local/bundle
    stdin_open: true
    tty: true
    # Start with rdbg debug server
    command: >
      rdbg --open --host 0.0.0.0 --port 38697 -c --
      ./msfconsole -r docker/msfconsole.rc -y /usr/src/metasploit-framework/config/database.yml

  # Service for running without debugger (use: docker-compose -f docker-compose.dev.yml --profile no-debug up msf-dev-no-debug)
  msf-dev-no-debug:
    profiles:
      - no-debug
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        user_id: ${UID:-1000}
        group_id: ${GID:-1000}
    environment:
      DATABASE_URL: postgres://postgres@db:5432/msf?pool=200&timeout=5
      RAILS_ENV: development
      DEV_MODE: "true"
    depends_on:
      - db
    ports:
      - "4444:4444"
    volumes:
      - .:/usr/src/metasploit-framework
      - ${HOME}/.msf4:/home/msf/.msf4
      - bundle_cache:/usr/local/bundle
    stdin_open: true
    tty: true
    command: ./msfconsole -r docker/msfconsole.rc -y /usr/src/metasploit-framework/config/database.yml

  db:
    image: postgres:10-alpine
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  pg_data_dev:
    driver: local
  bundle_cache:
    driver: local
